        // دالة مساعدة لاصطياد الكلمة بالكامل بدون تجزئة (بمصر، والعثمانية)
        const wrapRegex = (arr) => new RegExp('([^\\s.,:؛،؟"\'«»“”()\\n\\r\\-]*?(?:' + arr.join('|') + ')[^\\s.,:؛،؟"\'«»“”()\\n\\r\\-]*)', 'gi');

        const formatQuestionText = (text) => {
            if (!text) return text;
            
            let textStr = String(text).replace(/\\n/g, '\n');
            let remainingText = textStr.trim(); // الأسئلة تظل متجاورة ولا نكسر سطر الأرقام فيها

            const startersRegex = /^\s*(بم\s*تفسر|ما\s*النتائج(?:\s*المترتبة\s*عل[يى])?|ماذا\s*يحدث(?:\s*(?:لو|اذا|إذا))?|ما\s*رأيك(?:\s*ف[يى])?|ما\s*مقترحات(?:ك)?|هل\s*العبارة\s*صحيحة\s*[اأ]م\s*(?:خاطئة|خطأ)(?:\s*مع\s*التعليل)?|(?:بال[اأ]دلة\s*)?حدد(?:\s*مد[يى])?\s*صحة\s*[اأ]و\s*خطأ(?:\s*العبارة(?:\s*التالية)?)?|[اأ]يد(?:\s*صحة\s*[اأ]و\s*خطأ(?:\s*العبارة)?)?(?:\s*بال[اأ]دلة)?|دلل(?:\s*تاريخيا|\s*جغرافيا)?|قارن(?:\s*بين)?|ما\s*العلاقة(?:\s*بين)?|ضع\s*علامة(?:\s*صح\s*[اأ]و\s*خطأ)?|صوب|اكتب|[اأ]كمل|ما\s*المقصود(?:\s*بـ?)?|برهن|وضح|اختر)\s*[:؛؟?-]?\s*/i;
            const match = remainingText.match(startersRegex);
            
            let starterSpan = null;
            if (match) {
                starterSpan = <span key="starter" className={`${questionStarterColor} font-black ml-2 text-2xl`}>{match[0]}</span>;
                remainingText = remainingText.substring(match[0].length);
            }

            const places = ['مصر', 'آسيا', 'أوروبا', 'إفريقيا', 'الوطن العربي', 'الشام', 'العراق', 'فلسطين'];
            const characters = ['الإسلامي', 'الطولونية', 'الإخشيدية', 'الفاطمية', 'الأيوبية', 'المملوكية', 'العثماني', 'الفرنسية', 'صلاح الدين', 'عمر بن الخطاب'];
            const keywords = ['أعلى', 'اعلي', 'أولى', 'اولي', 'أقل', 'اقل', 'أكثر', 'اكثر', 'يختلف', 'تختلف', 'يتشابه', 'تتشابه', 'يتميز', 'تتميز', 'أكبر', 'اكبر', 'أصغر', 'اصغر', 'أهم', 'اهم', 'أول', 'اول', 'آخر', 'اخر', 'معظم', 'بعض', 'كل', 'جميع', 'يزداد', 'يقل', 'يرتفع', 'ينخفض'];
            
            let elements = [{ type: 'text', content: remainingText }];

            const processElements = (elems, regex, type) => {
                let newElems = [];
                elems.forEach(el => {
                    if (el.type !== 'text') { newElems.push(el); return; }
                    el.content.split(regex).forEach((part, idx) => {
                        if (part) newElems.push({ type: idx % 2 === 1 ? type : 'text', content: part });
                    });
                });
                return newElems;
            };

            elements = processElements(elements, /(\r?\n)/g, 'newline');
            
            // تلوين الكلمة الأولى بعد الترقيم باللون الأحمر
            let numberedElems = [];
            elements.forEach(el => {
                if (el.type !== 'text') { numberedElems.push(el); return; }
                let parts = el.content.split(/((?:^|\s)[0-9٠-٩]+\s*[-.]\s*)([^\s.,:؛،؟()]+)/g);

                        else if (i % 3 === 2) numberedElems.push({ type: 'numbered_intro', content: parts[i] }); 
                        else numberedElems.push({ type: 'text', content: parts[i] });
                    }

            elements = processElements(elements, /\*\*(.*?)\*\*/g, 'manual');

                if (el.type === 'place') return <span key={idx} className="text-red-600 font-black px-1">{el.content}</span>;
                if (el.type === 'character') return <span key={idx} className="text-[#4169e1] font-black px-1">{el.content}</span>;
                if (el.type === 'keyword') return <span key={idx} className="text-emerald-700 font-black px-1">{el.content}</span>;
                if (el.type === 'manual') return <span key={idx} className="font-bold text-blue-600 bg-blue-50 px-1 rounded-md">{el.content}</span>;
                return <span key={idx} className="text-gray-800">{el.content}</span>;
            });

            return (
                <React.Fragment>
                    {starterSpan}
                    {mappedElements}
                </React.Fragment>
            );
        };

        const highlightAnswer = (text, concept) => {
            if (!text) return text;

            let textStr = String(text).replace(/\\n/g, '\n');
            // كسر سطر جديد للأرقام في الإجابة والتعليل لعدم تجاورها (كما طلبت مسبقاً)
            let processedText = textStr.replace(/(\s+)?([0-9٠-٩]+\s*[-.]\s*(?![0-9٠-٩]))/g, '\n$2').trim();

            const places = ['مصر', 'آسيا', 'أوروبا', 'إفريقيا', 'الوطن العربي', 'الشام', 'العراق', 'فلسطين'];
            const characters = ['الإسلامي', 'الطولونية', 'الإخشيدية', 'الفاطمية', 'الأيوبية', 'المملوكية', 'العثماني', 'الفرنسية', 'صلاح الدين', 'عمر بن الخطاب'];
            const keywords = ['أعلى', 'اعلي', 'أولى', 'اولي', 'أقل', 'اقل', 'أكثر', 'اكثر', 'يختلف', 'تختلف', 'يتشابه', 'تتشابه', 'يتميز', 'تتميز', 'أكبر', 'اكبر', 'أصغر', 'اصغر', 'أهم', 'اهم', 'أول', 'اول', 'آخر', 'اخر', 'معظم', 'بعض', 'كل', 'جميع', 'يزداد', 'يقل', 'يرتفع', 'ينخفض'];
            let elements = [{ type: 'text', content: processedText }];
            
            const processElements = (elems, regex, type) => {
                let newElems = [];
                elems.forEach(el => {
                    if (el.type !== 'text') { newElems.push(el); return; }
                    el.content.split(regex).forEach((part, idx) => {
                        if (part) newElems.push({ type: idx % 2 === 1 ? type : 'text', content: part });
                    });
                });
                return newElems;
            };

            elements = processElements(elements, /(\r?\n)/g, 'newline');
            
            // تلوين الكلمة الأولى بعد الترقيم باللون الأحمر
            let numberedElems = [];
            elements.forEach(el => {
                if (el.type !== 'text') { numberedElems.push(el); return; }
                let parts = el.content.split(/((?:^|\s)[0-9٠-٩]+\s*[-.]\s*)([^\s.,:؛،؟()]+)/g);
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i]) {
                        if (i % 3 === 1) numberedElems.push({ type: 'text', content: parts[i] }); 
                        else if (i % 3 === 2) numberedElems.push({ type: 'numbered_intro', content: parts[i] }); 
                        else numberedElems.push({ type: 'text', content: parts[i] });
                    }
                }
            });
            elements = numberedElems;

            elements = processElements(elements, /((?:["'«”])[^"'»“]+(?:["'»“]))/g, 'quote');
            if (concept) elements = processElements(elements, new RegExp('([^\\s.,:؛،؟"\'«»“”()\\n\\r\\-]*?(?:' + concept.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')[^\\s.,:؛،؟"\'«»“”()\\n\\r\\-]*)', 'gi'), 'concept');
            elements = processElements(elements, /((?:[0-9]+|[٠-٩]+)(?:\s*(?:ق\.م|م|هـ))?)/g, 'date');
            elements = processElements(elements, /(\([^)]+\))/g, 'parentheses');
            
            if (places.length > 0) elements = processElements(elements, wrapRegex(places), 'place');
            if (characters.length > 0) elements = processElements(elements, wrapRegex(characters), 'character');
            if (keywords.length > 0) elements = processElements(elements, wrapRegex(keywords), 'keyword');
            
            elements = processElements(elements, /\*\*(.*?)\*\*/g, 'manual');

            return elements.map((el, idx) => {
                if (el.type === 'newline') return <br key={idx} />;
                if (el.type === 'numbered_intro') return <span key={idx} className="text-red-600 font-black px-1">{el.content}</span>;
                if (el.type === 'concept') return <span key={idx} className="text-secondary font-black px-1 bg-pink-50 rounded">{el.content}</span>;
                if (el.type === 'quote') return <span key={idx} className="text-purple-600 font-black px-1">{el.content}</span>;
                if (el.type === 'date') return <span key={idx} className="text-[#4169e1] font-black px-1">{el.content}</span>;
                if (el.type === 'parentheses') return <span key={idx} className="text-green-800 font-black px-1">{el.content}</span>;
                if (el.type === 'place') return <span key={idx} className="text-red-600 font-black px-1">{el.content}</span>;
                if (el.type === 'character') return <span key={idx} className="text-[#4169e1] font-black px-1">{el.content}</span>;
                if (el.type === 'keyword') return <span key={idx} className="text-emerald-700 font-black px-1">{el.content}</span>;
                if (el.type === 'manual') return <span key={idx} className="font-bold text-blue-600 bg-blue-50 px-1 rounded-md">{el.content}</span>;
                return <span key={idx} className="text-gray-800">{el.content}</span>;

        };

        const formatPhoneStr = (phone) => {
            if (!phone) return "";
            let cleaned = String(phone).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[\s\+\.]/g, "");
            if (cleaned.startsWith("20") && cleaned.length > 10) cleaned = cleaned.substring(2);
            if (cleaned.length === 10 && cleaned.startsWith("1")) cleaned = "0" + cleaned;
            return cleaned;

        const generateDeviceFingerprint = () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top"; ctx.font = "14px 'Arial'"; ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60"; ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069"; ctx.fillText("EdTech-Fingerprint", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)"; ctx.fillText("EdTech-Fingerprint", 4, 17);
            const b64 = canvas.toDataURL().replace("data:image/png;base64,","");
            const bin = atob(b64);
            const crc32 = function(r){for(var a,o=[],c=0;c<256;c++){a=c;for(var f=0;f<8;f++)a=1&a?3988292384^a>>>1:a>>>1;o[c]=a}for(var n=-1,t=0;t<r.length;t++)n=n>>>8^o[255&(n^r.charCodeAt(t))];return(-1^n)>>>0};
            return crc32(bin).toString(16) + "-" + navigator.userAgent.length;
        };

        const buildCourseData = (flatQuestions) => {
            const course = []; let unitCounter = 1; let lessonCounter = 1;
            if (!flatQuestions || !Array.isArray(flatQuestions)) return course; 
            flatQuestions.forEach(row => {
                const unitTitle = row.unit || "وحدة عامة"; const lessonTitle = row.section || "درس عام";
                let unit = course.find(u => u.title === unitTitle);
                if (!unit) { unit = { id: `unit_${unitCounter++}`, title: unitTitle, lessons: [] }; course.push(unit); }
                let lesson = unit.lessons.find(l => l.title === lessonTitle);
                if (!lesson) { lesson = { id: `lesson_${lessonCounter++}`, title: lessonTitle, questions: [], completed: false }; unit.lessons.push(lesson); }
                const options = [row.opt1, row.opt2, row.opt3, row.opt4].filter(o => o && o.toString().trim() !== "");
                lesson.questions.push({
                    type: row.type || "mcq", q: String(row.q), options: options, correct: String(row.correct),
                    reason: row.reason, answer: row.reason, concept: row.concept,
                    paragraph: row.paragraph, section: lessonTitle
                });
            });
            return course;
        };

        const DrawingCanvas = ({ isEnabled }) => {
            const canvasRef = useRef(null); const ctxRef = useRef(null); const [isDrawing, setIsDrawing] = useState(false); const pointsRef = useRef([]);
            useEffect(() => {
                const canvas = canvasRef.current; canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d'); ctx.lineCap = 'round'; ctx.strokeStyle = '#FF1493'; ctx.lineWidth = 4; ctxRef.current = ctx;
                const handleResize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; ctxRef.current.lineCap='round'; ctxRef.current.strokeStyle='#FF1493'; ctxRef.current.lineWidth=4; };
                window.addEventListener('resize', handleResize); return () => window.removeEventListener('resize', handleResize);
            }, []);
            const startDrawing = (e) => { if(!isEnabled) return; const rect = canvasRef.current.getBoundingClientRect(); const x = (e.clientX || e.touches[0].clientX) - rect.left; const y = (e.clientY || e.touches[0].clientY) - rect.top; ctxRef.current.beginPath(); ctxRef.current.moveTo(x, y); setIsDrawing(true); pointsRef.current = [{x, y}]; };
            const draw = (e) => { if(!isDrawing || !isEnabled) return; e.preventDefault(); const rect = canvasRef.current.getBoundingClientRect(); const x = (e.clientX || e.touches[0].clientX) - rect.left; const y = (e.clientY || e.touches[0].clientY) - rect.top; ctxRef.current.lineTo(x, y); ctxRef.current.stroke(); pointsRef.current.push({x, y}); };
            const stopDrawing = () => { if(!isDrawing) return; ctxRef.current.closePath(); setIsDrawing(false); checkIfCheckmark(pointsRef.current); };
            const checkIfCheckmark = (points) => {
                if(points.length < 15) return;
                let maxY = 0; let lowestIndex = 0;
                points.forEach((p, i) => { if(p.y > maxY){ maxY = p.y; lowestIndex = i; } });
                if(lowestIndex > points.length * 0.1 && lowestIndex < points.length * 0.9) {
                    let drops = 0; for(let i = 1; i < points.length; i++) { if(points[i].x < points[i-1].x - 10) drops++; }
                    if(drops < 3) { ctxRef.current.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); pointsRef.current = []; }
                }
            };
            return <canvas ref={canvasRef} id="drawing-canvas" className={isEnabled ? 'active' : ''} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseOut={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}></canvas>;
        };

        const App = () => {

            const [studentName, setStudentName] = useState('');
            const [inputPhone, setInputPhone] = useState('');
